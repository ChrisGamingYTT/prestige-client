name: Build Prestige Client

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: prestige-client-jar
        path: build/libs/prestige-client-*.jar
    
    - name: Upload build report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: build-report
        path: build/reports/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Download JAR
      uses: actions/download-artifact@v3
      with:
        name: prestige-client-jar
    
    - name: Display JAR info
      run: ls -lah prestige-client-*.jar
