name: Build Prestige Client

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --stacktrace
    
    - name: Upload JAR artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: prestige-client-jar
        path: |
          build/libs/prestige-client-*.jar
          !build/libs/*-sources.jar
          !build/libs/*-dev.jar
          !build/libs/*-sources.jar
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: prestige-client-jar
    
    - name: Display JAR info
      run: ls -lah prestige-client-*.jar || echo "JAR not found"
